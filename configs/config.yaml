data:
  raw_path: "data/raw/census.csv"
  processed_path: "data/processed/"
  test_size: 0.2
  random_state: 42
  label: "income"

preprocessing:
  scaling: "minmax"  # minmax, standard, robust
  handle_missing: "mean"  # mean, median

model:
  output_path: "models/"
  algorithm: "decision_tree"
  
  # Decision Tree parameters
  decision_tree:
    max_depth: 10
    min_samples_split: 20
    min_samples_leaf: 10

deployment:
  host: "0.0.0.0"
  port: 5000
  model_path: "models/best_model.pkl"
